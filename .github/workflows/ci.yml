name: Rust checks and Debian package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable snapshot
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Install Rust security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - name: Patched upstream service tests
        run: cargo test --locked --manifest-path vendor/tor-hsservice/Cargo.toml --lib --features ephemeral-service,hs-pow-full
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - run: cargo audit
      - run: cargo deny check
      - run: make deb
      - name: Offline CLI with unwritable HOME
        run: env HOME=/proc target/x86_64-unknown-linux-gnu/release/nulllobby --self-check
      - run: make deb-arti
      - name: Experimental binary offline diagnostics
        run: env HOME=/proc target/x86_64-unknown-linux-gnu/release/nulllobby --self-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nulllobby-linux
          path: dist/*
          if-no-files-found: error
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: nightly-2026-10-03
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: make fuzz-smoke
        env:
          NULLLOBBY_FUZZ_TOOLCHAIN: nightly-2026-10-03
