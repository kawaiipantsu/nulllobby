[workspace]
resolver = "3"
members = ["crates/*", "apps/nulllobby-tui", "xtask"]
default-members = ["apps/nulllobby-tui"]
exclude = ["fuzz", "vendor/tor-hsservice"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/kawaiipantsu/nulllobby"
homepage = "https://thugs.red"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
secrecy = "0.10.3"
zeroize = "1.9.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false, features = ["io-util", "sync"] }
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize", "static_secrets"] }
minicbor = { version = "2.3.0", features = ["std"] }
libc = "0.2.190"
toml_edit = "0.25.15"
nulllobby-core = { path = "crates/nulllobby-core", version = "=0.4.0" }
nulllobby-transport = { path = "crates/nulllobby-transport", version = "=0.4.0" }
nulllobby-platform = { path = "crates/nulllobby-platform", version = "=0.4.0" }
nulllobby-direct = { path = "crates/nulllobby-direct", version = "=0.4.0" }
nulllobby-tor = { path = "crates/nulllobby-tor", version = "=0.4.0" }
nulllobby-app = { path = "crates/nulllobby-app", version = "=0.4.0" }
nulllobby-bot = { path = "crates/nulllobby-bot", version = "=0.4.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[patch.crates-io]
# Arti 0.47.0, with the reviewed ephemeral service-storage patch in vendor/.
tor-hsservice = { path = "vendor/tor-hsservice" }
