[package]
name = "nulllobby-tor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
tor-arti-experimental = ["dep:arti-client", "dep:tor-hsservice", "dep:tor-rtcompat", "dep:tor-config-path", "dep:tor-proto", "dep:tor-cell", "dep:tor-keymgr", "dep:futures", "dep:tokio-util", "dep:rustls", "dep:tor-error"]

[dependencies]
nulllobby-transport.workspace = true
nulllobby-platform.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "macros", "fs"] }
data-encoding = "2.11.1"
sha3 = "0.12.0"
sha2.workspace = true
hmac.workspace = true
getrandom.workspace = true
zeroize.workspace = true
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "experimental-api", "ephemeral-keystore", "vanguards", "memquota"], optional = true }
tor-hsservice = { version = "=0.47.0", features = ["ephemeral-service"], optional = true }
tor-rtcompat = { version = "=0.47.0", features = ["tokio", "rustls"], optional = true }
tor-config-path = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", optional = true }
tor-cell = { version = "=0.47.0", optional = true }
tor-keymgr = { version = "=0.47.0", features = ["ephemeral-keystore"], optional = true }
tor-error = { version = "=0.47.0", optional = true }
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"], optional = true }
tokio-util = { version = "0.7.18", features = ["compat"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[lints]
workspace = true

[dev-dependencies]
nulllobby-core.workspace = true
