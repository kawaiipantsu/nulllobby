[package]
name = "nulllobby-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-or-later"
[package.metadata]
cargo-fuzz = true
[patch.crates-io]
tor-hsservice = { path = "../vendor/tor-hsservice" }
[dependencies]
libfuzzer-sys = "0.4.13"
nulllobby-core = { path = "../crates/nulllobby-core" }
nulllobby-direct = { path = "../crates/nulllobby-direct" }
nulllobby-transport = { path = "../crates/nulllobby-transport" }
nulllobby-tor = { path = "../crates/nulllobby-tor" }
tokio = { version = "1.53.2", features = ["rt"] }

[[bin]]
name = "bt_handshake"
path = "fuzz_targets/bt_handshake.rs"
test = false
doc = false
bench = false
